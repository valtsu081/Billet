<title>Billet</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Schibsted+Grotesk:wght@500;600;700;800&display=swap">
<style>
/* Layout: deep-blue sticky masthead with a tab rail over one centred work column (max 1120px);
   the overview splits roughly 3:2 on wide screens and stacks to one column on phones. */
:root {
  --bg: #eef1f5;
  --surface: #ffffff;
  --surface-2: #f4f6f9;
  --ink: #14202c;
  --muted: #566473;
  --faint: #8a96a3;
  --line: #dde3ea;
  --line-strong: #c3ccd6;
  --mast: #15325e;
  --mast-ink: #ffffff;
  --mast-muted: #b6c6dd;
  --mast-line: rgba(255,255,255,.24);
  --accent: #2457a6;
  --accent-ink: #ffffff;
  --accent-soft: #e2ebf8;
  --in: #1f9e6e;
  --out: #e0662f;
  --in-text: #13744d;
  --ok: #23804f;  --ok-soft: #e0f1e7;
  --warn: #9a6200; --warn-soft: #faefd5; --warn-fill: #d99413;
  --bad: #bf3a2f;  --bad-soft: #fbe3e0; --bad-ink: #ffffff;
  --c0: #7d8894; --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100;
  --c5: #e87ba4; --c6: #008300; --c7: #6250d6; --c8: #e34948;
  --shadow: 0 1px 2px rgba(20,32,44,.06), 0 6px 20px rgba(20,32,44,.07);
  --f-display: "Schibsted Grotesk", "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1217; --surface: #151b22; --surface-2: #1b232c; --ink: #e6ebf0; --muted: #9ca9b6; --faint: #6d7a87;
    --line: #252f39; --line-strong: #34414d;
    --mast: #101a28; --mast-ink: #e6ebf0; --mast-muted: #8d9cae; --mast-line: #2b3747;
    --accent: #7aa6ea; --accent-ink: #0d1217; --accent-soft: #1a2a40;
    --in: #25a073; --out: #de6a33; --in-text: #55c897;
    --ok: #55c08a; --ok-soft: #163225; --warn: #e9ad45; --warn-soft: #382a11; --warn-fill: #d99a2b;
    --bad: #f07d73; --bad-soft: #3c1c1a; --bad-ink: #1a0d0c;
    --c0: #8b96a2; --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500;
    --c5: #d55181; --c6: #2a9a2a; --c7: #9085e9; --c8: #e66767;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 6px 20px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1217; --surface: #151b22; --surface-2: #1b232c; --ink: #e6ebf0; --muted: #9ca9b6; --faint: #6d7a87;
  --line: #252f39; --line-strong: #34414d;
  --mast: #101a28; --mast-ink: #e6ebf0; --mast-muted: #8d9cae; --mast-line: #2b3747;
  --accent: #7aa6ea; --accent-ink: #0d1217; --accent-soft: #1a2a40;
  --in: #25a073; --out: #de6a33; --in-text: #55c897;
  --ok: #55c08a; --ok-soft: #163225; --warn: #e9ad45; --warn-soft: #382a11; --warn-fill: #d99a2b;
  --bad: #f07d73; --bad-soft: #3c1c1a; --bad-ink: #1a0d0c;
  --c0: #8b96a2; --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500;
  --c5: #d55181; --c6: #2a9a2a; --c7: #9085e9; --c8: #e66767;
  --shadow: 0 1px 2px rgba(0,0,0,.35), 0 6px 20px rgba(0,0,0,.3);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--mast); }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; line-height: 1.2; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1120px; margin-inline: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Masthead */
.masthead { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--mast); color: var(--mast-ink); }
.mast-row { display: flex; align-items: center; gap: 10px; padding-block: 12px 6px; }
.brand { display: flex; align-items: center; gap: 10px; color: inherit; text-decoration: none; margin-right: auto; min-width: 0; }
.brand-mark { width: 32px; height: 32px; flex: none; border-radius: 9px; background: var(--mast-ink); color: var(--mast); display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: 19px; }
.brand-name { font-family: var(--f-display); font-weight: 700; font-size: 19px; letter-spacing: -0.015em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mast-tools { display: flex; align-items: center; gap: 8px; }
.mast-btn { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border-radius: 9px; border: 1px solid var(--mast-line); background: transparent; color: var(--mast-ink); cursor: pointer; font-weight: 500; white-space: nowrap; }
.mast-btn:hover { background: rgba(255,255,255,.08); }
.mast-btn[aria-pressed="true"] { background: var(--mast-ink); color: var(--mast); border-color: transparent; }
.mast-btn:disabled { opacity: .45; cursor: default; }
.mast-btn.icon-only { width: 36px; padding: 0; justify-content: center; text-decoration: none; }
.mast-btn.icon-only[aria-current="page"] { background: var(--mast-ink); color: var(--mast); border-color: transparent; }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs a { padding: 10px 12px 11px; color: var(--mast-muted); text-decoration: none; font-weight: 500; border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs a:hover { color: var(--mast-ink); }
.tabs a[aria-current="page"] { color: var(--mast-ink); border-bottom-color: var(--mast-ink); font-weight: 600; }
@media (max-width: 720px) {
  .mast-btn { padding: 0 10px; }
  .brand-name { font-size: 17px; }
}

/* Page */
.main { padding-block: 20px 104px; display: flex; flex-direction: column; gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; min-width: 0; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px 12px; margin-bottom: 12px; flex-wrap: wrap; }
.card-head h2 { font-size: 16px; font-weight: 700; }
.card-head .link { font-size: 13px; font-weight: 500; text-decoration: none; }
.grid-2 { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
@media (max-width: 880px) { .grid-2 { grid-template-columns: minmax(0, 1fr); } }
.eyebrow { font-size: 11.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.amt { font-family: var(--f-display); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.hero-num .amt, .stat .amt, .budget-nums .amt { font-variant-numeric: proportional-nums; }
.pos { color: var(--in-text); }
.neg-bad { color: var(--bad); }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.hint { font-size: 12.5px; color: var(--muted); display: flex; gap: 6px; align-items: flex-start; }
.hint svg { flex: none; margin-top: 2px; }
.foot-note { font-size: 12.5px; color: var(--muted); max-width: 70ch; }
.page-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.page-head h1 { font-size: 24px; font-weight: 700; }
.page-head .lede { color: var(--muted); margin-top: 4px; max-width: 62ch; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: 9px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); font-weight: 500; cursor: pointer; white-space: nowrap; text-decoration: none; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.07); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.small { height: 30px; padding: 0 10px; font-size: 13px; }
.btn.danger { color: var(--bad); }
.btn.armed { background: var(--bad); color: var(--bad-ink); border-color: var(--bad); }
.icon-btn { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); cursor: pointer; }
.icon-btn:hover { background: var(--surface-2); }

/* Chips and banners */
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); white-space: nowrap; border: 1px solid var(--line); }
.chip.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.chip.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.chip.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.chip.acc { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.banner { display: flex; align-items: center; justify-content: space-between; gap: 10px 16px; flex-wrap: wrap; padding: 12px 16px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); }
.banner.info { background: var(--accent-soft); border-color: transparent; }
.banner.warn { background: var(--warn-soft); border-color: transparent; }
.banner .b-actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* Overview hero */
.hero { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px 32px; align-items: end; }
.hero-num { font-family: var(--f-display); font-size: clamp(30px, 5vw, 42px); font-weight: 700; letter-spacing: -0.025em; line-height: 1.05; margin-top: 4px; }
.hero-sub { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 8px; color: var(--muted); font-size: 13px; }
.hero-sub .amt { color: var(--ink); font-weight: 600; }
.hero-month { display: flex; gap: 24px; flex-wrap: wrap; padding-left: 24px; border-left: 1px solid var(--line); }
.stat { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat .amt { font-size: 19px; }
.stat .sub { font-size: 12px; color: var(--muted); }
@media (max-width: 760px) { .hero { grid-template-columns: minmax(0, 1fr); } .hero-month { padding-left: 0; border-left: 0; padding-top: 14px; border-top: 1px solid var(--line); } }

/* Stats strip */
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.stats .stat { padding: 2px 16px; border-left: 1px solid var(--line); }
.stats .stat:first-child { border-left: 0; padding-left: 0; }
@media (max-width: 640px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); row-gap: 14px; } .stats .stat:nth-child(3) { border-left: 0; padding-left: 0; } }

/* Lists */
.rows { list-style: none; margin: 0; padding: 0; }
.row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); min-width: 0; }
.rows > li:first-child > .row, .rows > .row:first-child { border-top: 0; }
.row-hit { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 6px; margin-inline: -6px; background: none; border: 0; border-top: 1px solid var(--line); text-align: left; cursor: pointer; border-radius: 8px; min-width: 0; width: calc(100% + 12px); }
.rows > li:first-child > .row-hit { border-top-color: transparent; }
.row-hit:hover { background: var(--surface-2); }
.row-main { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.row-title { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-meta { font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; gap: 6px; align-items: center; }
.row-end { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.sw { width: 10px; height: 10px; border-radius: 3px; background: var(--sw, var(--c0)); flex: none; }
.sw.ring { background: transparent; border: 2px solid var(--sw, var(--c0)); }
.sw.lg { width: 14px; height: 14px; border-radius: 4px; }
.kind-ico { width: 30px; height: 30px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--line); display: grid; place-items: center; flex: none; color: var(--muted); }

/* Transactions */
.day + .day { margin-top: 14px; }
.day-h { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); font-weight: 600; padding: 0 0 4px; border-bottom: 1px solid var(--line); }
.day .rows > li:first-child > .row-hit { border-top-color: transparent; }
.sched-li { display: flex; flex-wrap: wrap; align-items: center; gap: 0 8px; border-top: 1px dashed var(--line-strong); }
.rows > li.sched-li:first-child { border-top-color: transparent; }
.sched-li .row-hit { border-top: 0; flex: 1 1 260px; width: auto; }
.sched-li .row-title { color: var(--muted); }
.sched-actions { display: flex; gap: 6px; padding-bottom: 6px; margin-left: auto; }

/* Category breakdown */
.bd { display: flex; flex-direction: column; }
.bd-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 5px 12px; padding: 7px 0; }
.bd-name { display: flex; gap: 8px; align-items: center; min-width: 0; }
.bd-name span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bd-val { display: flex; gap: 8px; align-items: baseline; }
.bd-val .pct { font-size: 12px; color: var(--muted); width: 3.2em; text-align: right; font-variant-numeric: tabular-nums; }
.bd-bar { grid-column: 1 / -1; height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.bd-bar span { display: block; height: 100%; background: var(--sw); border-radius: 0 3px 3px 0; }

/* Budgets */
.budget-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 16px; }
.budget { display: flex; flex-direction: column; gap: 10px; }
.budget-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.budget-top h3 { font-size: 16px; font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.budget-nums { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.budget-nums .big { font-size: 20px; }
.bbar-wrap { position: relative; padding-block: 3px; }
.bbar { position: relative; height: 12px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
.bbar-fill, .bbar-sched { position: absolute; top: 0; bottom: 0; }
.bbar-fill { left: 0; background: var(--accent); }
.bbar-fill.warn { background: var(--warn-fill); }
.bbar-fill.bad { background: var(--bad); }
.bbar-sched { background: repeating-linear-gradient(135deg, var(--accent) 0 3px, transparent 3px 6px); opacity: .6; }
.bbar-sched.warn { background: repeating-linear-gradient(135deg, var(--warn-fill) 0 3px, transparent 3px 6px); }
.bbar-sched.bad { background: repeating-linear-gradient(135deg, var(--bad) 0 3px, transparent 3px 6px); }
.bbar-pace, .bbar-limit { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--ink); border-radius: 1px; }
.bbar-limit { background: var(--bad); width: 3px; }
.budget-detail { display: flex; flex-direction: column; gap: 3px; font-size: 12.5px; color: var(--muted); }
.cat-chips { display: flex; flex-wrap: wrap; gap: 4px; }
.cat-chips .chip { font-weight: 500; }
.bud-legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); align-items: center; }
.bud-legend i { display: inline-block; width: 14px; height: 8px; border-radius: 2px; margin-right: 5px; vertical-align: middle; }
.bud-legend .l-spent { background: var(--accent); }
.bud-legend .l-sched { background: repeating-linear-gradient(135deg, var(--accent) 0 3px, transparent 3px 6px); opacity: .7; border: 1px solid var(--line); }
.bud-legend .l-pace { width: 2px; height: 12px; background: var(--ink); }
.mini-budget { padding: 10px 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
.mini-budget:first-child { border-top: 0; padding-top: 0; }
.mini-budget .bbar { height: 8px; }
.mini-top { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.mini-top strong { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Chart */
.legend { display: flex; gap: 16px; font-size: 12.5px; color: var(--muted); align-items: center; flex-wrap: wrap; }
.lg { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.lg.in { background: var(--in); } .lg.out { background: var(--out); }
.chart { display: grid; grid-template-columns: 56px minmax(0, 1fr); grid-template-rows: 180px auto; margin-top: 12px; }
.ch-y { position: relative; }
.ch-y span { position: absolute; right: 8px; transform: translateY(50%); font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.ch-plot { position: relative; border-bottom: 1px solid var(--line-strong); }
.ch-grid { position: absolute; left: 0; right: 0; height: 0; border-top: 1px solid var(--line); }
.ch-cols { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); }
.ch-col { display: flex; align-items: flex-end; justify-content: center; gap: 2px; border-radius: 6px 6px 0 0; cursor: default; outline-offset: -2px; }
.ch-col:hover, .ch-col:focus-visible { background: var(--surface-2); }
.ch-bar { width: min(18px, 34%); border-radius: 4px 4px 0 0; min-height: 0; }
.ch-bar.in { background: var(--in); } .ch-bar.out { background: var(--out); }
.ch-x { grid-column: 2; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); font-size: 11.5px; color: var(--muted); text-align: center; padding-top: 6px; }
.ch-x .now { color: var(--ink); font-weight: 600; }
details.table-view { margin-top: 10px; font-size: 12.5px; }
details.table-view summary { cursor: pointer; color: var(--muted); }
.tbl-wrap { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; margin-top: 8px; font-variant-numeric: tabular-nums; }
table.tbl th, table.tbl td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
table.tbl th:first-child, table.tbl td:first-child { text-align: left; }
table.tbl th { font-weight: 600; color: var(--muted); font-size: 12px; }
.tip { position: fixed; z-index: 60; background: var(--ink); color: var(--bg); padding: 8px 10px; border-radius: 8px; font-size: 12.5px; pointer-events: none; box-shadow: var(--shadow); min-width: 170px; }
.tip strong { display: block; margin-bottom: 4px; font-family: var(--f-display); }
.tip div { display: flex; justify-content: space-between; gap: 14px; align-items: center; }
.tip b { font-variant-numeric: tabular-nums; font-weight: 600; }

/* Month view */
.toolbar { display: flex; flex-direction: column; gap: 12px; }
.month-nav { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.month-title { font-size: 24px; font-weight: 700; min-width: 9ch; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.filters select, .filters input { height: 34px; flex: 1 1 150px; max-width: 220px; }
.filters input[type="search"] { max-width: 260px; }

/* Loans */
.loan-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 16px; }
.loan { display: flex; flex-direction: column; gap: 12px; }
.loan-facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 16px; font-size: 13px; }
.loan-facts dt { color: var(--muted); font-size: 12px; }
.loan-facts dd { margin: 0; font-weight: 500; }
.loan-pays { font-size: 12.5px; }
.loan-pays li { display: flex; justify-content: space-between; gap: 8px; padding: 4px 0; border-top: 1px solid var(--line); }
.loan-pays li:first-child { border-top: 0; }
.card-actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* Category columns */
.two-col { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start; }
@media (max-width: 760px) { .two-col { grid-template-columns: minmax(0, 1fr); } }

/* Empty / loading */
.empty { text-align: center; padding: 36px 20px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.empty p { color: var(--muted); max-width: 52ch; }
.spinner { width: 26px; height: 26px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--accent); animation: spin 0.9s linear infinite; }

.onboard { max-width: 560px; margin: 24px auto 0; padding: 28px; display: flex; flex-direction: column; gap: 16px; }

.onboard p { color: var(--muted); }
.or { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 12.5px; }
.or::before, .or::after { content: ""; flex: 1; border-top: 1px solid var(--line); }

/* Forms */
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field > span:first-child, .field-label { font-size: 12.5px; font-weight: 600; color: var(--muted); }
.field-row > .field { flex: 1 1 170px; }
.field-row > .field.narrow { flex: 0 1 90px; }
.field-row { display: flex; gap: 12px; flex-wrap: wrap; }
input[type="text"], input[type="search"], input[type="date"], input[type="number"], input:not([type]), select, textarea {
  height: 38px; border: 1px solid var(--line-strong); border-radius: 9px; background: var(--surface); padding: 0 10px; width: 100%; min-width: 0; font-size: 14px;
}
input:focus, select:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.money-in { position: relative; display: block; }

.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 2px; flex-wrap: wrap; align-self: flex-start; }

.check-line { display: flex; gap: 8px; align-items: center; cursor: pointer; font-weight: 500; }
.check-line input { width: 16px; height: 16px; accent-color: var(--accent); }
.checks { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 170px), 1fr)); gap: 6px; }

.repeat { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 12px; }
.prefs { display: flex; flex-direction: column; gap: 16px; }

.pref.stack { display: grid; grid-template-columns: minmax(0, 1fr); justify-content: stretch; gap: 12px; align-items: start; }
.themes { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 120px), 1fr)); gap: 8px; }
.theme-opt { position: relative; display: flex; flex-direction: column; gap: 8px; padding: 10px; border: 1px solid var(--line); border-radius: 10px; cursor: pointer; font-weight: 500; }
.theme-opt input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }

.app-version { text-align: center; font-size: 12px; color: var(--faint); padding-top: 4px; }

/* Category picks */
.pick-group { display: flex; flex-direction: column; gap: 6px; }

.pick-btn { display: inline-flex; padding: 4px 10px; border-radius: 999px; border: 1px dashed var(--line-strong); background: transparent; color: var(--muted); cursor: pointer; font-size: 12.5px; font-weight: 500; }

.inline-add { display: flex; gap: 8px; flex-wrap: wrap; }
.inline-add input { flex: 1 1 180px; width: auto; }
.inline-add select { flex: 0 1 130px; width: auto; }
.sugg-line { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }

/* Chart period controls */
.chart-nav { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

.chart-sum { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); margin-top: 8px; }
.chart-sum .amt { color: var(--ink); }
.icon-btn.sm { width: 30px; height: 30px; }
.icon-btn:disabled { opacity: .35; cursor: default; }
.seg.sm span { padding: 4px 12px; font-size: 13px; }
.chart.days .ch-bar { width: min(7px, 42%); border-radius: 2px 2px 0 0; }
.chart.days .ch-col { gap: 1px; border-radius: 3px 3px 0 0; }
.chart.days .ch-x { font-size: 10.5px; }
.ch-x .minor { visibility: hidden; }
@media (min-width: 1100px) { .chart.days .ch-x .minor { visibility: visible; color: var(--faint); } }
.ch-x .future { color: var(--faint); }
.tip ul { list-style: none; margin: 6px 0 0; padding: 6px 0 0; border-top: 1px solid rgba(127,127,127,.4); }
.tip li { display: flex; justify-content: space-between; gap: 12px; opacity: .85; }

/* CSV */
textarea { height: auto; min-height: 180px; padding: 8px 10px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; resize: vertical; }
input[type="file"] { height: auto; padding: 7px; border: 1px dashed var(--line-strong); border-radius: 9px; background: var(--surface-2); width: 100%; min-width: 0; }
.imp-tbl th:nth-child(2), .imp-tbl td:nth-child(2), .imp-tbl th:nth-child(3), .imp-tbl td:nth-child(3) { text-align: left; max-width: 200px; overflow: hidden; text-overflow: ellipsis; }
.imp-bad { color: var(--bad); }
.imp-skip { color: var(--muted); }
details.more summary { cursor: pointer; color: var(--accent); font-weight: 500; font-size: 13px; }
details.more[open] summary { margin-bottom: 10px; }

/* Dialog */
dialog#modal { border: 0; padding: 0; border-radius: 16px; background: var(--surface); color: var(--ink); width: min(580px, calc(100vw - 32px)); max-height: calc(100dvh - 48px); box-shadow: 0 24px 70px rgba(0,0,0,.35); }

.mform { display: flex; flex-direction: column; max-height: calc(100dvh - 48px); }
.m-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 16px 20px 6px; }
.m-head h2 { font-size: 19px; }
.m-head .icon-btn { border-color: transparent; }
.m-body { padding: 8px 20px 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
.m-err { color: var(--bad); font-weight: 500; font-size: 13px; }

@media (max-width: 640px) {
  dialog#modal { width: 100vw; max-width: 100vw; margin: auto 0 0; border-radius: 16px 16px 0 0; max-height: 92dvh; }
  .mform { max-height: 92dvh; }
  .m-foot { padding-bottom: max(12px, env(safe-area-inset-bottom, 0px)); }
  input[type="text"], input[type="search"], input[type="date"], input[type="number"], input:not([type]), select { font-size: 16px; }
}

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 500; box-shadow: var(--shadow); opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 70; max-width: calc(100vw - 32px); }

/* Touch: no grey/blue tap box, no long-press dragging or text selection on controls; our own pressed state instead. */
* { -webkit-tap-highlight-color: transparent; }
a, button, img, svg, label { -webkit-user-drag: none; -webkit-touch-callout: none; }
button, a, label, .tabs, .seg, .chip, .row-hit, .brand, .mast-tools, .ch-col, .tgl, .theme-opt, .pick, .check, .check-line, .card-head, .eyebrow, .day-h, .month-nav, .chart-nav, .legend { -webkit-user-select: none; user-select: none; }
input, textarea { -webkit-user-select: text; user-select: text; }
.btn, .icon-btn, .mast-btn, .pick-btn, .picker-btn, .linkish { transition: transform .08s ease, filter .08s ease, background-color .08s ease; }
.btn:active, .icon-btn:active, .mast-btn:active, .pick-btn:active, .picker-btn:active { transform: scale(.96); filter: brightness(.94); }
.row-hit:active, .picker-opt:active { background: var(--line); }
.tabs a:active { color: var(--mast-ink); background: rgba(255,255,255,.08); }

.ch-col:active { background: var(--line); }
@media (prefers-reduced-motion: reduce) { .btn:active, .icon-btn:active, .mast-btn:active, .pick-btn:active, .picker-btn:active { transform: none; } }

/* In-app picker: replaces the phone's system list for every <select> */
.picker-src { display: none !important; }
.picker-btn { display: flex; align-items: center; gap: 8px; height: 38px; width: 100%; min-width: 0; padding: 0 10px; border: 1px solid var(--line-strong); border-radius: 9px; background: var(--surface); color: var(--ink); cursor: pointer; text-align: left; font-size: 14px; }
.picker-btn .picker-val { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.picker-btn svg { flex: none; color: var(--muted); }
.picker-btn:disabled { opacity: .5; cursor: default; }
.filters .picker-btn { height: 34px; flex: 1 1 150px; max-width: 220px; width: auto; }
.inline-add .picker-btn { flex: 0 1 130px; width: auto; }
dialog.picker { border: 0; padding: 0; background: var(--surface); color: var(--ink); box-shadow: 0 24px 70px rgba(0,0,0,.35); width: 100vw; max-width: 100vw; margin: auto 0 0; border-radius: 18px 18px 0 0; max-height: 72dvh; padding-bottom: env(safe-area-inset-bottom, 0px); }
dialog.picker[open] { display: flex; flex-direction: column; animation: sheet-up .18s ease-out; }

dialog.picker.pop { position: fixed; margin: 0; inset: auto; max-height: min(360px, 60vh); border-radius: 12px; border: 1px solid var(--line); box-shadow: var(--shadow); padding-bottom: 0; }

@keyframes sheet-up { from { transform: translateY(24px); } to { transform: none; } }
@media (prefers-reduced-motion: reduce) { dialog.picker[open] { animation: none; } }
.picker-grip { width: 36px; height: 4px; border-radius: 2px; background: var(--line-strong); margin: 8px auto 0; flex: none; }
.picker-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 12px 4px 18px; }
.picker-head strong { font-family: var(--f-display); font-size: 17px; }
.picker-head .icon-btn { border-color: transparent; }
.picker.pop .picker-grip, .picker.pop .picker-head { display: none; }
.picker-list { overflow-y: auto; padding: 4px 8px 12px; overscroll-behavior: contain; }
.picker.pop .picker-list { padding: 6px; }
.picker-group { font-size: 11.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); padding: 12px 10px 4px; }
.picker-opt { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 48px; padding: 8px 12px; border: 0; border-radius: 10px; background: none; color: var(--ink); text-align: left; cursor: pointer; font-size: 15px; }
.picker.pop .picker-opt { min-height: 36px; font-size: 14px; padding: 6px 10px; }
.picker-opt .picker-text { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.picker-opt:hover, .picker-opt:focus-visible { background: var(--surface-2); outline: none; }
.picker-opt[aria-selected="true"] { color: var(--accent); font-weight: 600; background: var(--accent-soft); }
.picker-opt svg { color: var(--accent); flex: none; }

/* Import screen */
.imp { display: flex; flex-direction: column; gap: 14px; }
.imp-file { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); }
.imp-file svg { flex: none; }
.imp-file strong { color: var(--ink); overflow-wrap: anywhere; }
.imp-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(68px, 1fr)); gap: 6px; }
.imp-stats:empty { display: none; }

.imp-stat b { font-family: var(--f-display); font-size: 21px; line-height: 1.15; font-variant-numeric: tabular-nums; }
.imp-stat span { font-size: 11.5px; line-height: 1.25; color: var(--muted); }

.tgl .picker-btn { width: auto; max-width: 58%; flex: 0 1 auto; }
:is(.tgl, .switch) input[type="checkbox"] { appearance: none; -webkit-appearance: none; flex: none; width: 42px; height: 26px; margin: 0; border-radius: 13px; background: var(--line-strong); position: relative; cursor: pointer; transition: background-color .15s; }
:is(.tgl, .switch) input[type="checkbox"]::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .15s; }
:is(.tgl, .switch) input[type="checkbox"]:checked { background: var(--accent); }
:is(.tgl, .switch) input[type="checkbox"]:checked::after { transform: translateX(16px); }
:is(.tgl, .switch) input[type="checkbox"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { :is(.tgl, .switch) input[type="checkbox"], :is(.tgl, .switch) input[type="checkbox"]::after { transition: none; } }
.switch { display: inline-flex; flex: none; padding: 2px 0; cursor: pointer; }
.pref.has-switch { flex-wrap: nowrap; align-items: flex-start; }
.pref.has-switch > div { min-width: 0; }
.imp-cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 12px; }
.imp-cols > div { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 12px; }
@media (max-width: 420px) { .imp-cols, .imp-cols > div { grid-template-columns: minmax(0, 1fr); } }
.imp .rows .row { padding: 8px 0; }

/* Category page and tappable categories */
.cat-head { display: flex; align-items: center; gap: 12px; min-width: 0; }
.cat-head > .sw.lg { width: 18px; height: 18px; border-radius: 5px; }
.cat-head h1 { font-size: 24px; font-weight: 700; overflow-wrap: anywhere; }
.cat-head .lede { margin-top: 2px; }
.mini-chart { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px; align-items: end; }
.mc-col { display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: 0; padding: 4px 0 6px; border-radius: 8px; cursor: pointer; color: var(--muted); min-width: 0; font: inherit; }
.mc-col:hover { background: var(--surface-2); }
.mc-area { height: 100px; width: 100%; display: flex; align-items: flex-end; justify-content: center; border-bottom: 1px solid var(--line-strong); }
.mc-bar { width: min(28px, 62%); background: var(--sw); border-radius: 4px 4px 0 0; opacity: .4; }
.mc-col.on .mc-bar { opacity: 1; }
.mc-val { font-size: 11.5px; font-variant-numeric: tabular-nums; color: var(--ink); font-weight: 600; min-height: 1.35em; white-space: nowrap; }
.mc-lbl { font-size: 11.5px; }
.mc-col.on .mc-lbl { color: var(--ink); font-weight: 700; }
.bd-hit { width: calc(100% + 12px); margin: 0 -6px; padding: 7px 6px; background: none; border: 0; border-radius: 8px; color: inherit; text-align: left; cursor: pointer; font: inherit; }
.bd-hit:hover { background: var(--surface-2); }
.bd-hit:active { background: var(--line); }
.chip-btn { cursor: pointer; font-family: inherit; }
.chip-btn:hover { border-color: var(--line-strong); }
.row-chev { flex: none; color: var(--faint); display: grid; place-items: center; }

/* Budget bar: fill colour steps up as the budget is used (≤25 %, ≤50 %, ≤75 %, above) */
.meter { height: 14px; border-radius: 7px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
.meter.sm { height: 8px; border-radius: 4px; }
.meter-fill { display: block; height: 100%; }
.lvl-low { background: var(--ok); }
.lvl-mid { background: var(--accent); }
.lvl-high { background: var(--warn-fill); }
.lvl-max { background: var(--bad); }
.budget-name { display: flex; flex-direction: column; min-width: 0; }
.budget-left { display: flex; flex-direction: column; gap: 2px; }
.budget-left-row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.budget-left-row .big { font-size: 24px; }
/* Three-number summaries: one row on wide screens; on phones two side by side and the third underneath */
.stats.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
@media (max-width: 640px) {
  .stats.three { grid-template-columns: repeat(2, minmax(0, 1fr)); row-gap: 12px; }
  .stats.three .stat:nth-child(3) { grid-column: 1 / -1; border-left: 0; padding: 12px 0 0; border-top: 1px solid var(--line); }
}

/* Floating Add transaction button: bottom right, a round-cornered square on phones, with its label on wider screens. */
.fab { position: fixed; z-index: 25; right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-width: 56px; height: 56px; padding: 0 16px; border: 0; border-radius: 16px; background: var(--fab-bg, var(--accent)); color: var(--fab-ink, var(--accent-ink)); font-weight: 600; font-size: 15px; cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,.18), 0 8px 22px rgba(0,0,0,.18); transition: transform .08s ease, filter .08s ease; }
.fab:hover { filter: brightness(1.06); }
.fab:active { transform: scale(.95); filter: brightness(.94); }
.fab-label { display: none; }
@media (min-width: 721px) { .fab { padding: 0 22px 0 18px; } .fab-label { display: inline; } }
@media (prefers-reduced-motion: reduce) { .fab:active { transform: none; } }
body.has-fab .toast { bottom: calc(88px + env(safe-area-inset-bottom, 0px)); }

/* Phones: the main pages sit in a bottom bar and More opens a sheet with the rest. Wider screens keep the top tabs. */
.bottom-nav { display: none; }
.more-opt { text-decoration: none; }

/* ---------- Persistence: this device only (localStorage), with an in-memory fallback ---------- */
const LS_PREFIX = 'billet:v1:';
const dirty = new Set(), inflight = new Set();
let backend = null;
const memStore = {};
const isPending = id => dirty.has(id) || inflight.has(id) || touched.has(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
function persist(id) { dirty.add(id); if (backend && !inflight.has(id)) flush(id); }
async function flush(id) {
  inflight.add(id);
  try {
    while (dirty.has(id)) {
      dirty.delete(id);
      const data = S.docs[id];
      const run = () => (data ? backend.set(id, clone(data)) : backend.del(id));
      try { await run(); }
      catch (e) { if (e && e.code === 'unavailable') { await sleep(400 + Math.random() * 800); await run(); } else throw e; }
    }

}
function reportSaveError(e) {
  const code = e && e.code;
  let msg = 'Couldn’t save your last change. Check your connection, then make the change again.';
  if (code === 'invalid_argument') msg = 'Couldn’t save: you can only view this ledger, or the change was too large.';
  if (code === 'quota_exceeded') msg = 'Couldn’t save: storage for this ledger is full. Delete old months to make room.';
  if (code === 'revoked' || code === 'not_granted') msg = 'Saving was switched off for this page. Reload it to try again.';
  toast(msg, 'bad');
}
function commit(msg) {
  for (const id of touched) {
    const d = S.docs[id];
    if (id.startsWith('tx-') && d && (!d.items || !d.items.length)) delete S.docs[id];
    persist(id);
  }
  touched.clear();
  render();
  if (msg) toast(msg);
}
const local = {
  set(id, data) { try { localStorage.setItem(LS_PREFIX + id, JSON.stringify(data)); delete memStore[id]; } catch (e) { if (S.localOk) toast('This browser isn’t letting Billet save, so your changes will be lost when you close the page. Export a backup in Settings.', 'bad'); S.localOk = false; memStore[id] = data; } },
  del(id) { try { localStorage.removeItem(LS_PREFIX + id); } catch (e) { /* storage blocked */ } delete memStore[id]; },
  loadAll() {
    const out = {};
    try {
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.startsWith(LS_PREFIX)) { try { out[k.slice(LS_PREFIX.length)] = JSON.parse(localStorage.getItem(k)); } catch (e) { /* skip broken entry */ } }
      }
    } catch (e) { S.localOk = false; }
    return Object.assign(out, memStore);
  },
};
function startLocal(note) {
  S.mode = 'local'; S.note = note || '';
  backend = local;
  S.docs = Object.assign(local.loadAll(), S.docs);

async function boot() {

/* Another tab or window on this device saved a change: pick it up. */
window.addEventListener('storage', e => {
  if (!e.key || !e.key.startsWith(LS_PREFIX)) return;
  const id = e.key.slice(LS_PREFIX.length);
  if (isPending(id)) return;

  render();
});

    </tbody></table>` : '<p class="muted">Nothing recorded in this period.</p>'}</div></details>`;
}
function refreshChart() { const el = $('#chart-card'); if (el) el.innerHTML = chartCard(); }
function miniBudget(b, key) {

    ${budgetMeter(s, true)}

function budgetMeter(s, small) {

function periodLabel(p) {

  return `${fmtDate(p.from, sameYear ? { day: 'numeric', month: 'short' } : { day: 'numeric', month: 'short', year: 'numeric' })} – ${fmtDate(p.to, { day: 'numeric', month: 'short', year: 'numeric' })}`;
}
function signedAmount(t, acctFilter) {

/* ----- Month ----- */
function monthNav() {
  const cur = curKey();
  return `<div class="month-nav"><button class="icon-btn" type="button" data-act="month-prev" aria-label="Previous month">${icon('left', 18)}</button>
    <h1 class="month-title">${esc(monthLabel(UI.month))}</h1>
    <button class="icon-btn" type="button" data-act="month-next" aria-label="Next month">${icon('right', 18)}</button>
    ${UI.month !== cur ? `<button class="btn small ghost" type="button" data-act="month-today">Back to ${esc(monthLabel(cur))}</button>` : ''}</div>`;
}
function filterFn() {
  const q = UI.q.trim().toLowerCase();
  return t => {
    if (UI.acct && t.accountId !== UI.acct && t.toAccountId !== UI.acct) return false;
    if (UI.type && t.type !== UI.type) return false;
    if (UI.cat === 'none' ? !!t.categoryId || t.type === 'transfer' : UI.cat && t.categoryId !== UI.cat) return false;
    if (q) { const hay = `${t.note || ''} ${t.type === 'transfer' ? 'transfer' : catName(t.categoryId)} ${accName(t.accountId)} ${t.toAccountId ? accName(t.toAccountId) : ''}`.toLowerCase(); if (!hay.includes(q)) return false; }
    return true;
  };
}
function monthView() {
  const any = UI.acct || UI.cat || UI.type || UI.q;
  const cats = k => categories().filter(c => c.kind === k).map(c => catOpt(c, UI.cat)).join('');
  return `<div class="toolbar">
    <div class="page-head">${monthNav()}</div>
    <div class="filters" role="group" aria-label="Filter transactions">
      <select id="f-acct" aria-label="Account"><option value="">All accounts</option>${accounts().map(a => opt(a.id, a.name + (a.archived ? ' (archived)' : ''), UI.acct)).join('')}</select>
      <select id="f-cat" aria-label="Category"><option value="">All categories</option><optgroup label="Expenses">${cats('expense')}</optgroup><optgroup label="Income">${cats('income')}</optgroup>${opt('none', 'Uncategorized', UI.cat)}</select>
      <select id="f-type" aria-label="Type"><option value="">All types</option>${opt('expense', 'Expenses', UI.type)}${opt('income', 'Income', UI.type)}${opt('transfer', 'Transfers', UI.type)}</select>
      <input id="f-q" type="search" placeholder="Search descriptions" value="${esc(UI.q)}" aria-label="Search descriptions" autocomplete="off">
      ${any ? '<button class="btn small ghost" type="button" data-act="clear-filters">Clear filters</button>' : ''}
    </div></div>
    <div id="month-body" class="main" style="padding:0">${monthBody()}</div>`;
}
function monthBody() {
  const key = UI.month, f = filterFn();
  const txs = monthTx(key).filter(f);
  const sched = scheduledFor(key).filter(f);
  const t = monthTotals(txs);
  const sIn = sum(sched.filter(s => s.type === 'income'), s => s.amount), sOut = sum(sched.filter(s => s.type === 'expense'), s => s.amount);
  const today = todayStr();
  const posted = txs.slice().sort((a, b) => b.date.localeCompare(a.date));
  const days = [];
  for (const x of posted) { if (!days.length || days[days.length - 1].date !== x.date) days.push({ date: x.date, items: [] }); days[days.length - 1].items.push(x); }
  const schedBlock = sched.length ? `<div class="day"><div class="day-h"><span>${sched.some(s => s.date <= today) ? 'Due and scheduled' : 'Still scheduled this month'}</span><span>${plural(sched.length, 'item', 'items')}</span></div>
    <ul class="rows">${sched.map(s => schedRow(s, today)).join('')}</ul></div>` : '';
  const stats = `<section class="card stats">
    <div class="stat"><span class="eyebrow">Income</span>${money(t.inc, { sign: true, cls: 'pos' })}${sIn ? `<span class="sub">+${esc(fmtMoney(sIn))} scheduled</span>` : '<span class="sub">&nbsp;</span>'}</div>
    <div class="stat"><span class="eyebrow">Expenses</span>${money(-t.exp)}${sOut ? `<span class="sub">${esc(fmtMoney(sOut))} more scheduled</span>` : '<span class="sub">&nbsp;</span>'}</div>
    <div class="stat"><span class="eyebrow">Net</span>${money(t.net, { sign: true, cls: t.net >= 0 ? 'pos' : '' })}<span class="sub">${t.inc ? `${Math.round(Math.max(0, t.net) / t.inc * 100)} % of income kept` : '&nbsp;'}</span></div>
    <div class="stat"><span class="eyebrow">Projected net</span>${money(t.net + sIn - sOut, { sign: true })}<span class="sub">After scheduled items</span></div>
  </section>`;
  const list = days.length || sched.length ? schedBlock + days.map(d => {
    const dayExp = sum(d.items.filter(x => x.type === 'expense'), x => x.amount);
    return `<div class="day"><div class="day-h"><span>${esc(fmtDate(d.date, { weekday: 'short', day: 'numeric', month: 'short' }))}${d.date === today ? ' · Today' : ''}</span>${dayExp ? `<span>${esc(fmtMoney(-dayExp))}</span>` : ''}</div>
      <ul class="rows">${d.items.map(txRow).join('')}</ul></div>`;

  return `${stats}
  <div class="grid-2">
    <section class="card"><div class="card-head"><h2>Transactions</h2><span class="muted small">${plural(txs.length, 'transaction', 'transactions')}${sched.length ? ` · ${sched.length} scheduled` : ''}</span></div>${list}</section>
    <div class="col">

      <section class="card"><div class="card-head"><h2>Income by category</h2></div>${breakdown(txs, 'income')}</section>

}
const any = () => !!(UI.acct || UI.cat || UI.type || UI.q);
function txRow(t) {

      ${signedAmount(d.rec, '')}

  <section class="card">

      <span class="row-end">${signedAmount(r, '')}<span class="row-meta">${r.paused ? '<span class="chip">Paused</span>' : n ? `Next ${esc(fmtDate(n.date, { day: 'numeric', month: 'short', year: n.date.slice(0, 4) !== todayStr().slice(0, 4) ? 'numeric' : undefined }))}` : '<span class="chip">Ended</span>'}${!r.paused && n ? (r.auto ? ' · Auto' : ' · Manual') : ''}</span></span>

/* ----- Loans ----- */
function loansView() {

  let owe = 0, lent = 0, int = 0;
  const st = new Map(ls.map(l => [l.id, loanState(l)]));
  for (const l of ls) { const s = st.get(l.id); if (l.direction === 'lent') lent += s.outstanding; else { owe += s.outstanding; int += s.interest; } }
  return `<div class="page-head"><div><h1>Loans</h1><p class="lede">Track what you owe and what others owe you. Link a payment to a loan from the transaction form and the balance goes down.</p></div>
    <button class="btn primary" type="button" data-act="add-loan">${icon('plus')} Add loan</button></div>
  ${ls.length ? `<section class="card stats three">
    <div class="stat"><span class="eyebrow">You owe</span>${money(-owe, { hide })}</div>
    <div class="stat"><span class="eyebrow">Owed to you</span>${money(lent, { hide })}</div>

}

  else if (p.none) payoffTxt = 'Add a monthly payment to estimate';
  const recent = s.pays.slice(-3).reverse();
  return `<section class="card loan">
    <div class="budget-top"><h3>${esc(l.name)}</h3><span class="chip ${owe ? '' : 'acc'}">${owe ? 'You owe' : 'Owed to you'}</span></div>

      <div class="muted small">${Math.round(s.pct * 100)} % repaid of ${hide ? esc(hiddenTxt()) : esc(fmtMoney(l.principal))}${l.who ? ` · ${owe ? 'Lender' : 'Borrower'}: ${esc(l.who)}` : ''}</div></div>
    <div class="bbar" role="img" aria-label="${Math.round(s.pct * 100)} percent repaid"><span class="bbar-fill" style="width:${(s.pct * 100).toFixed(1)}%;background:var(--ok)"></span></div>

        <div class="muted small">${isEur ? `${esc(String(l.euribor.tenor))}-month Euribor ${esc(fmtPct(l.euribor.value))} + ${esc(fmtPct(l.euribor.margin))} margin${l.euribor.floor && l.euribor.value < 0 ? ', Euribor counted as 0 %' : ''}` : l.rate ? 'Fixed' : ''}</div></dd></div>
      <div><dt>Monthly payment</dt><dd>${l.payment ? money(l.payment) : 'Not set'}</dd></div>

/* ----- One category: its transactions for a chosen month, the last six months and its budgets ----- */
function categoryView() {
  const id = UI.catId, c = id ? catOf(id) : null;
  if (id && !c) return `<section class="card empty"><h2>This category doesn’t exist any more</h2><p>It may have been deleted.</p><a class="btn" href="#categories">Back to categories</a></section>`;
  const kind = c ? c.kind : (UI.catKind || 'expense'), isExp = kind === 'expense';
  const name = c ? c.name : 'Uncategorized', color = `var(--c${c ? c.color : 0})`;
  const match = t => t.type === kind && (id ? t.categoryId === id : !t.categoryId);
  const key = UI.month, cur = curKey(), today = todayStr();
  const txs = monthTx(key).filter(match).sort((a, b) => b.date.localeCompare(a.date));
  const sched = scheduledFor(key).filter(match);
  const total = sum(txs, t => t.amount);
  const months = [-5, -4, -3, -2, -1, 0].map(i => { const k = addMonthsKey(key, i); return { k, v: sum(monthTx(k).filter(match), t => t.amount), future: k > cur }; });
  // Average over the months since this category was first used (within the six), not counting future months.
  const first = months.findIndex(m => m.v > 0);
  const prev = months[4], past = first < 0 ? [] : months.slice(first).filter(m => !m.future);
  const avg = past.length ? Math.round(sum(past, m => m.v) / past.length) : 0;
  const max = Math.max(1, ...months.map(m => m.v));
  const diff = total - prev.v, diffPct = prev.v ? Math.round(diff / prev.v * 100) : null;
  const inBudgets = id && isExp ? budgets().filter(b => !budgetCats(b).length || budgetCats(b).includes(id)) : [];
  const bKey = key === cur ? currentPeriodKey() : key;
  const days = [];
  for (const t of txs) { if (!days.length || days[days.length - 1].date !== t.date) days.push({ date: t.date, items: [] }); days[days.length - 1].items.push(t); }
  const label = m => `${monthLabel(m.k)}: ${fmtMoney(m.v)}`;
  return `<div class="page-head">
      <div class="cat-head"><button class="icon-btn" type="button" data-act="back" aria-label="Back">${icon('left', 18)}</button><span class="sw lg" style="--sw:${color}"></span>
        <div><h1>${esc(name)}</h1><p class="lede">${isExp ? 'Expense' : 'Income'} category</p></div></div>
      <div class="card-actions">${c ? `<button class="btn" type="button" data-act="edit-cat" data-id="${esc(c.id)}">Edit</button>` : ''}<button class="btn primary" type="button" data-act="add-tx" data-type="${kind}" data-cat="${esc(id || '')}">${icon('plus')} Add</button></div>
    </div>
    ${monthNav()}
    <section class="card stats">
      <div class="stat"><span class="eyebrow">${isExp ? 'Spent' : 'Received'}</span>${money(isExp ? -total : total, { sign: !isExp, cls: isExp ? '' : 'pos' })}<span class="sub">${key === cur ? 'so far this month' : esc(monthLabel(key))}</span></div>
      <div class="stat"><span class="eyebrow">Transactions</span><span class="amt">${txs.length}</span><span class="sub">${txs.length ? `${esc(fmtMoney(Math.round(total / txs.length)))} on average` : '&nbsp;'}</span></div>
      <div class="stat"><span class="eyebrow">Compared with ${esc(monthShort(prev.k))}</span>${money(diff, { sign: true })}<span class="sub">${diffPct == null ? `nothing in ${esc(monthShort(prev.k))}` : `${diffPct > 0 ? '+' : diffPct < 0 ? '−' : ''}${Math.abs(diffPct)} %`}</span></div>
      <div class="stat"><span class="eyebrow">Monthly average</span>${money(avg)}<span class="sub">${past.length ? `over ${plural(past.length, 'month', 'months')}` : 'no data yet'}</span></div>
    </section>
    <div class="grid-2">
      <section class="card"><div class="card-head"><h2>${esc(monthLabel(key))}</h2><span class="muted small">${plural(txs.length, 'transaction', 'transactions')}${sched.length ? ` · ${sched.length} scheduled` : ''}</span></div>
        ${sched.length ? `<div class="day"><div class="day-h"><span>Still scheduled this month</span></div><ul class="rows">${sched.map(s => schedRow(s, today)).join('')}</ul></div>` : ''}
        ${days.length ? days.map(d => `<div class="day"><div class="day-h"><span>${esc(fmtDate(d.date, { weekday: 'short', day: 'numeric', month: 'short' }))}${d.date === today ? ' · Today' : ''}</span><span>${esc(fmtMoney(sum(d.items, t => t.amount)))}</span></div>
            <ul class="rows">${d.items.map(txRow).join('')}</ul></div>`).join('')
          : `<div class="empty"><p>No ${isExp ? 'spending' : 'income'} in ${esc(name)} in ${esc(monthLabel(key))}.</p></div>`}
      </section>
      <div class="col">
        <section class="card"><div class="card-head"><h2>Last 6 months</h2></div>
          <div class="mini-chart" style="--sw:${color}">${months.map(m => `<button type="button" class="mc-col${m.k === key ? ' on' : ''}" data-act="cat-month" data-k="${m.k}" title="${esc(label(m))}" aria-label="${esc(label(m))}"${m.k === key ? ' aria-current="true"' : ''}>
            <span class="mc-val">${m.k === key ? esc(fmtShort(m.v)) : ''}</span><span class="mc-area"><span class="mc-bar" style="height:${(m.v / max * 100).toFixed(1)}%"></span></span><span class="mc-lbl">${esc(monthShort(m.k))}</span></button>`).join('')}</div>
          <p class="hint">Tap a month to show its transactions.</p></section>
        ${inBudgets.length ? `<section class="card"><div class="card-head"><h2>In budgets</h2><a class="link" href="#budgets">All budgets</a></div>${inBudgets.map(b => miniBudget(b, bKey)).join('')}</section>` : ''}
      </div>
    </div>`;
}

/* ---------- Modals ---------- */
function openModal(o) {
  const dlg = $('#modal');
  dlg.innerHTML = `<form class="mform" id="mform" novalidate>
    <div class="m-head"><h2 id="m-title">${esc(o.title)}</h2><button type="button" class="icon-btn" data-act="close-modal" aria-label="Close">${icon('x', 18)}</button></div>
    <div class="m-body">${o.body}<p class="m-err" id="m-err" role="alert" hidden></p></div>
    <div class="m-foot">${o.del ? `<button type="button" class="btn danger" id="m-del">${esc(o.del.label || 'Delete')}</button>` : ''}<span class="sp"></span>
      <button type="button" class="btn ghost" data-act="close-modal">Cancel</button><button type="submit" class="btn primary">${esc(o.submit || 'Save')}</button></div></form>`;
  const form = $('#mform');
  form.addEventListener('submit', e => {
    e.preventDefault();
    const err = o.onSubmit(form);
    if (err === true) return;
    if (err) { const el = $('#m-err'); el.textContent = err; el.hidden = false; } else closeModal();
  });
  if (o.del) $('#m-del').addEventListener('click', e => confirmClick(e.currentTarget, () => { o.del.run(); closeModal(); }, o.del.confirm || 'Click again to delete'));
  if (o.onMount) o.onMount(form);
  if (!dlg.open) dlg.showModal();
  const first = form.querySelector('[data-autofocus]');
  if (first) first.focus();
}
function closeModal() { const d = $('#modal'); if (d.open) d.close(); d.innerHTML = ''; }
function confirmClick(btn, fn, armedLabel) {
  if (btn.dataset.armed === '1') { fn(); return; }
  const orig = btn.innerHTML;
  btn.dataset.armed = '1'; btn.textContent = armedLabel || 'Click again to confirm'; btn.classList.add('armed');
  setTimeout(() => { if (btn.isConnected && btn.dataset.armed === '1') { btn.dataset.armed = ''; btn.innerHTML = orig; btn.classList.remove('armed'); } }, 4000);
}
const typeSeg = (type, types) => `<div class="seg" role="radiogroup" aria-label="Type">${(types || ['expense', 'income', 'transfer']).map(t => `<label><input type="radio" name="type" value="${t}" ${type === t ? 'checked' : ''}><span>${TYPE_LABEL[t]}</span></label>`).join('')}</div>`;
const amountField = (label, name, c, auto, allowNeg) => `<label class="field"><span>${esc(label)}</span><span class="money-in"><input id="m-${name}" name="${name}" inputmode="decimal" autocomplete="off" placeholder="0,00" value="${c || c === 0 && allowNeg ? esc(amountInput(c)) : ''}"${auto ? ' data-autofocus' : ''}><i>€</i></span></label>`;
function accOpts(sel) {
  const list = activeAccounts().concat(accounts().filter(a => a.archived && a.id === sel));
  return list.map(a => opt(a.id, a.name, sel)).join('');
}
function routeFields(m, withInterest) {
  return `<div class="field-row">
    <label class="field"><span id="m-acct-label">Account</span><select id="m-acct" name="accountId">${accOpts(m.accountId)}</select></label>
    <label class="field" data-for="transfer"><span>To account</span><select id="m-to" name="toAccountId"><option value="">Choose…</option>${accOpts(m.toAccountId)}</select></label>
    <label class="field" data-for="expense income"><span>Category</span><select id="m-cat" name="categoryId"></select></label>
    <label class="field" id="m-newcat-field" hidden><span>New category name</span><input id="m-newcat" name="newcat" maxlength="40" placeholder="For example: Pets"></label>
  </div>
  <div class="field-row" id="m-loan-row">
    <label class="field"><span>Loan</span><select id="m-loan" name="loanId"></select></label>
    ${withInterest ? `<label class="field" id="m-int-field"><span>Interest part</span><span class="money-in"><input id="m-interest" name="interest" inputmode="decimal" autocomplete="off" value="${m.interest ? esc(amountInput(m.interest)) : ''}"><i>€</i></span></label>` : ''}
  </div>`;
}
function wireRoute(form, m) {
  const typeOf = () => form.querySelector('input[name=type]:checked').value;
  const cat = $('#m-cat', form), loanSel = $('#m-loan', form), loanRow = $('#m-loan-row', form), intIn = $('#m-interest', form), intField = $('#m-int-field', form);
  let first = true, intTouched = !!m.interest;
  const sync = () => {
    const tp = typeOf();
    form.querySelectorAll('[data-for]').forEach(el => { el.hidden = !el.dataset.for.split(' ').includes(tp); });
    $('#m-acct-label', form).textContent = tp === 'transfer' ? 'From account' : 'Account';
    const curCat = first ? (m.categoryId || '') : cat.value;
    cat.innerHTML = '<option value="">Uncategorized</option>' + categories().filter(c => c.kind === tp).map(c => catOpt(c, curCat)).join('') + opt('__new', '+ New category…', curCat);
    $('#m-newcat-field', form).hidden = tp === 'transfer' || cat.value !== '__new';
    const dir = tp === 'income' ? 'lent' : 'owe';
    const ls = tp === 'transfer' ? [] : loans().filter(l => l.direction === dir);
    const curLoan = first ? (m.loanId || '') : loanSel.value;
    loanSel.innerHTML = `<option value="">${tp === 'income' ? 'Not a loan repayment' : 'Not a loan payment'}</option>` + ls.map(l => opt(l.id, l.name, curLoan)).join('');
    loanRow.hidden = !ls.length;
    if (intField) intField.hidden = !loanSel.value;
    first = false;
  };
  const estimate = () => {
    if (!intIn || intTouched || !loanSel.value) return;
    const l = byId(loans(), loanSel.value), amt = parseAmount(form.elements.amount.value);
    intIn.value = l && amt > 0 && effRate(l) ? amountInput(estInterest(l, amt, m.id)) : '';
  };
  form.querySelectorAll('input[name=type]').forEach(r => r.addEventListener('change', () => { sync(); estimate(); }));
  loanSel.addEventListener('change', () => { intTouched = false; sync(); estimate(); });
  cat.addEventListener('change', () => { const f = $('#m-newcat-field', form); f.hidden = cat.value !== '__new'; if (!f.hidden) $('#m-newcat', form).focus(); });
  form.elements.amount.addEventListener('input', estimate);
  if (intIn) intIn.addEventListener('input', () => { intTouched = true; });
  sync();
  if (m.loanId && !m.id) estimate();
}
function readMovement(form, withInterest) {
  const E = form.elements, type = form.querySelector('input[name=type]:checked').value;
  const amount = parseAmount(E.amount.value);
  if (!(amount > 0)) return { err: 'Enter an amount above zero, for example 12,50.' };
  const accountId = E.accountId.value;
  if (!accountId) return { err: 'Choose an account. You can add one on the Accounts tab.' };
  const out = { type, amount, accountId };
  if (type === 'transfer') {
    if (!E.toAccountId.value || E.toAccountId.value === accountId) return { err: 'Choose a different account to move the money to.' };

/* Turn every row into a transaction (status ok), a planned payment (planned), a duplicate or empty row (skip) or an error (bad).

function ensureAccount(name) {

  if (found) return found.id;
  const kind = /talletus|s(ä|a)(ä|a)st|saving/i.test(name) ? 'savings' : /cash|k(ä|a)teinen/i.test(name) ? 'cash' : 'checking';
  const a = { id: uid('a'), name, kind, opening: 0 };

function runImport() {

  const res = buildImportRows(), ok = res.filter(x => x.status === 'ok');
  const plans = IMP.planned ? planGroups(res) : { recurring: [], single: [] };
  plans.recurring = plans.recurring.filter(p => !p.exists);
  if (!ok.length && !plans.recurring.length && !plans.single.length) return 'There is nothing new to import: everything in this file is already in the ledger.';
  if (ok.length + plans.single.length > 5000) return 'That’s more than 5 000 transactions. Import a shorter date range at a time.';
  const created = new Map();
  const realAcct = id => { if (!id || !id.startsWith('new:')) return id; const name = id.slice(4); if (!created.has(name)) created.set(name, ensureAccount(name)); return created.get(name); };

  const today = todayStr();
  let latest = '';
  for (const t of ok.map(x => x.tx).concat(plans.single)) {
    t.accountId = realAcct(t.accountId); if (t.toAccountId) t.toAccountId = realAcct(t.toAccountId);
    realCat(t); t.id = uid('t'); putTx(t);
    if (t.date <= today && t.date > latest) latest = t.date;
  }
  let recAdded = 0;
  for (const p of plans.recurring) {
    const t = clone(p.tx);
    t.accountId = realAcct(t.accountId); if (t.toAccountId) t.toAccountId = realAcct(t.toAccountId);
    realCat(t);
    const name = plannedName(t);
    if (recs().some(r => r.name === name && r.type === t.type && r.amount === t.amount && r.accountId === t.accountId && r.start === p.start && r.freq === p.freq)) continue;
    edit('recurring').items.push({ id: uid('r'), name, type: t.type, amount: t.amount, accountId: t.accountId, toAccountId: t.toAccountId || null, categoryId: t.categoryId || null, loanId: null,

  if (recAdded) msg.push(`added ${plural(recAdded, 'recurring payment', 'recurring payments')}`);
  if (created.size) msg.push(`created ${plural(created.size, 'account', 'accounts')}`);

}

/* ---------- App lock ----------
